<!DOCTYPE html>
<html lang="en">
<head>
    <title>Bootstrap Example</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

    <form >
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
        <div class="mb-3 mt-3">
            <label for="email" class="form-label">Email:</label>
            <input type="email" class="form-control" id="email" placeholder="Enter email" name="email">
        </div>
        <div class="mb-3">
            <label for="pwd" class="form-label">Password:</label>
            <input type="password" class="form-control" id="pwd" placeholder="Enter password" name="pswd">
        </div>
        <button type="button" onclick="" class="btn btn-primary">Submit</button>
    </form>

    <div id="user" class="container mt-3">

    </div>

</body>
<script th:inline="javascript">

    function login(){
        let email = document.getElementById('email');
        let passWord = document.getElementById('pwd');

        if(email == null){
            Swal.fire({
                icon: "error",
                title: "Vui lòng nhập đầy đủ thông tin",
                text: "Chưa nhập email",
            });
            email.focus();
            return false;
        }

        if(passWord == null){
            Swal.fire({
                icon: "error",
                title: "Vui lòng nhập đầy đủ thông tin",
                text: "Chưa nhập email",
            });
            passWord.focus();
            return false;
        }



    }

    let u = /*[[${user}]]*/ [];
    let html = `
            <div class="card" style="width:400px">
                <img class="card-img-top" src="${u.avatar}" alt="Card image" style="width:100%">
                <div class="card-body">
                    <h4 class="card-title">${u.fullName}</h4>
                    <p class="card-text">${u.gender}</p>
                    <p class="card-text">${u.address}</p>
                    <p class="card-text">${u.role}</p>
                    <p class="card-text">${u.status}</p>
                </div>
            </div>
        `

    document.getElementById('user').innerHTML = html;
</script>
</html>
