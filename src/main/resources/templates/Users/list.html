<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <title></title>
</head>
<body>
<table class="table table-striped">
    <thead>
    <tr>
        <th>ID</th>
        <th>User Name</th>
        <th>Pass Word</th>
        <th>Full Name</th>
        <th>Avatar</th>
        <th>Gender</th>
        <th>phone</th>
        <th>Email</th>
        <th>Address</th>
        <th>Role</th>
        <th>Status</th>
        <th>Create At</th>
    </tr>
    </thead>
    <tbody id="ListUsers">

    </tbody>
</table>
</body>
<script th:inline="javascript">
    let listUsers = /*[[${listUsers}]]*/ [];
    let html = '';

    for(let i = 0; i < listUsers.length; i++){
        html += `
        <tr>
            <td>${listUsers[i].id}</td>
            <td>${listUsers[i].userName}</td>
            <td>${listUsers[i].passWord}</td>
            <td>${listUsers[i].fullName}</td>
            <td>${listUsers[i].avatar}</td>
            <td>${listUsers[i].gender}</td>
            <td>${listUsers[i].phone}</td>
            <td>${listUsers[i].email}</td>
            <td>${listUsers[i].address}</td>
            <td>${listUsers[i].role}</td>
            <td>${listUsers[i].status}</td>
            <td>${listUsers[i].createAt}</td>
        </tr>
        `
    }

    document.getElementById('ListUsers').innerHTML = html;

</script>
</html>
